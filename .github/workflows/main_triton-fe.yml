name: Build and deploy Triton-FE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: triton-fe-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"
  npm_config_engine_strict: "true"
  AZURE_WEBAPP_NAME: Triton-FE
  AZURE_RESOURCE_GROUP: TritonV3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run audit:security
      - run: npm test
      - name: Build production SPA
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          VITE_SYNCFUSION_LICENSE_KEY: ${{ vars.VITE_SYNCFUSION_LICENSE_KEY || secrets.VITE_SYNCFUSION_LICENSE_KEY }}
          REQUIRE_PRODUCTION_CONFIG: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ "$REQUIRE_PRODUCTION_CONFIG" = true ]; then
            node -e 'const u = new URL(process.env.VITE_API_BASE_URL); if (u.protocol !== "https:" || /^(localhost|127\.)/.test(u.hostname) || !process.env.VITE_SYNCFUSION_LICENSE_KEY) process.exit(1)'
          fi
          npm run build
      - run: npm run package:deployment
      - run: npm run smoke:deployment
      - name: Archive runtime-only release
        run: cd deployment-package && zip -qr ../release.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: triton-runtime
          path: release.zip
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triton-runtime
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_342D948E1B9F4F649BFAF65335B9F8F6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6E6C98CA3E72424D9E3D170E967BB67D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3C50D9DC2D2249FBA4AA8410621AE3A7 }}
      - name: Use the prebuilt runtime package
        run: >-
          az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP"
          --name "$AZURE_WEBAPP_NAME" --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false
          ENABLE_ORYX_BUILD=false NODE_ENV=production --output none
      - name: Replace production files and restart
        id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: production
          package: release.zip
          startup-command: npm start
          clean: true
          restart: true
      - name: Verify the running production commit and HTTP behavior
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          for attempt in $(seq 1 12); do
            if node scripts/smoke-deployment.mjs "$APP_URL" "$GITHUB_SHA"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
